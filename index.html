<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Najhla – Acuarela Romántica</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --romantic-bg:      #fdf8f5;
      --romantic-text:    #3d3431;
      --romantic-primary: #d96b7e;
      --romantic-soft:    #f9eae7;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* ── TARJETA ── */
    .invitation-card {
      max-width: 430px;
      width: 100%;
      border-radius: 24px;
      padding: 36px 30px 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.45);
      position: relative;
      overflow: hidden;
      background-color: var(--romantic-bg);
      color: var(--romantic-text);
      text-align: center;
      background-image:
        radial-gradient(circle at 10% 10%,  rgba(255,182,193,0.28) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%,  rgba(253,220,220,0.30) 0%, transparent 60%),
        radial-gradient(circle at 50% 40%,  rgba(255,240,243,0.50) 0%, transparent 70%);
    }

    /* flores de esquina */
    .invitation-card::before {
      content: '✿';
      position: absolute; top: 15px; left: 20px;
      font-size: 1.8rem; color: rgba(217,107,126,0.22);
    }
    .invitation-card::after {
      content: '✿';
      position: absolute; bottom: 15px; right: 20px;
      font-size: 1.8rem; color: rgba(217,107,126,0.22);
    }

    /* marco interior sutil */
    .inner-frame {
      border: 1px solid rgba(217,107,126,0.14);
      border-radius: 16px;
      padding: 28px 18px;
    }

    /* ── MOÑO ── */
    .bow-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 4px;
      filter: drop-shadow(0 3px 8px rgba(217,107,126,0.22));
      animation: sway 5s ease-in-out infinite alternate;
    }
    @keyframes sway {
      0%   { transform: rotate(-1.5deg); }
      100% { transform: rotate( 1.5deg); }
    }

    /* ── NOMBRE ── */
    .guest-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      color: #9c847d;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .name-calligraphy {
      font-family: 'Pinyon Script', cursive;
      font-size: 5.2rem;
      color: var(--romantic-primary);
      line-height: 0.85;
      margin-bottom: 18px;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.8);
    }

    /* ── NÚMERO 1 FRESA ── */
    .strawberry-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 4px 0 20px;
    }
    .strawberry-line {
      height: 1px;
      width: 55px;
      background: linear-gradient(to right, transparent, rgba(217,107,126,0.35), transparent);
    }
    .strawberry-1 {
      filter: drop-shadow(0 4px 8px rgba(217,107,126,0.25));
      animation: float 3.5s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0)   scale(1);    }
      50%      { transform: translateY(-6px) scale(1.03); }
    }

    /* ── BADGE ── */
    .celebration-badge {
      display: inline-block;
      background: rgba(217,107,126,0.08);
      border: 1px solid rgba(217,107,126,0.2);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--romantic-primary);
      margin-bottom: 22px;
      font-weight: 600;
    }

    /* ── MENSAJE ── */
    .message-body {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      line-height: 1.78;
      color: #5a4f4c;
      margin-bottom: 28px;
    }

    /* ── FECHA ── */
    .romantic-date-display {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 0 0 28px;
    }
    .date-side {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #9c847d;
      border-top: 1px solid rgba(0,0,0,0.1);
      border-bottom: 1px solid rgba(0,0,0,0.1);
      padding: 5px 0;
      width: 72px;
    }
    .date-center {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 400;
      line-height: 1;
      color: var(--romantic-primary);
    }

    /* ── DETALLES ── */
    .romantic-details-list { text-align: center; margin-bottom: 4px; }
    .romantic-item {
      margin-bottom: 18px;
      position: relative;
      padding-bottom: 8px;
    }
    .romantic-item:not(:last-child)::after {
      content: '·';
      position: absolute; bottom: -8px; left: 50%;
      transform: translateX(-50%);
      color: rgba(0,0,0,0.15);
      font-size: 1.2rem;
    }
    .romantic-item h5 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #9c847d;
      margin-bottom: 3px;
    }
    .romantic-item p {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: var(--romantic-text);
      font-weight: 600;
    }

    /* ── BOTONES ── */
    .actions-area {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .web-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 24px;
      font-size: 0.79rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-decoration: none;
      border-radius: 50px;
      transition: all 0.3s cubic-bezier(0.165,0.84,0.44,1);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
    }
    .btn-primary {
      background: var(--romantic-primary);
      color: #fff;
      box-shadow: 0 8px 20px rgba(217,107,126,0.28);
      border: none;
    }
    .btn-primary:hover {
      background: #c55669;
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(217,107,126,0.4);
    }
    .btn-secondary {
      background: #fff;
      color: var(--romantic-primary);
      border: 1px solid rgba(217,107,126,0.25);
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .btn-secondary:hover {
      background: var(--romantic-soft);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="invitation-card">
    <div class="inner-frame">

      <!-- ══ MOÑO (recoloreado en tonos románticos) ══ -->
      <div class="bow-wrapper">
        <svg width="148" height="84" viewBox="0 0 160 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Lazo izquierdo -->
          <path d="M75 45C30 10 10 30 15 55C20 75 55 65 75 45Z"
                fill="#f2a0b5" stroke="#c9607a" stroke-width="2.5"/>
          <circle cx="35" cy="45" r="2.5" fill="#fff" opacity="0.65"/>
          <circle cx="55" cy="55" r="2.5" fill="#fff" opacity="0.65"/>
          <!-- Lazo derecho -->
          <path d="M85 45C130 10 150 30 145 55C140 75 105 65 85 45Z"
                fill="#f2a0b5" stroke="#c9607a" stroke-width="2.5"/>
          <circle cx="125" cy="45" r="2.5" fill="#fff" opacity="0.65"/>
          <circle cx="105" cy="55" r="2.5" fill="#fff" opacity="0.65"/>
          <!-- Cintas colgantes -->
          <path d="M70 50C60 70 45 85 40 85" stroke="#c9607a" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M90 50C100 70 115 85 120 85" stroke="#c9607a" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Nudo central (pequeña fresa delicada) -->
          <circle cx="80" cy="45" r="13" fill="#d96b7e" stroke="#c9607a" stroke-width="1.8"/>
          <path d="M73 38C76 34 84 34 87 38C84 39 76 39 73 38Z" fill="#a8d8a8"/>
          <circle cx="76" cy="44" r="1"   fill="#fff" opacity="0.8"/>
          <circle cx="84" cy="44" r="1"   fill="#fff" opacity="0.8"/>
          <circle cx="80" cy="50" r="1"   fill="#fff" opacity="0.8"/>
        </svg>
      </div>

      <p class="guest-text">Nuestra dulce niña</p>
      <h1 class="name-calligraphy">Najhla</h1>

      <!-- ══ NÚMERO 1 FRESA (tamaño reducido, tono romántico) ══ -->
      <div class="strawberry-row">
        <div class="strawberry-line"></div>
        <div class="strawberry-1">
          <svg width="50" height="70" viewBox="0 0 110 150" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M40 35H62V135C62 142 55 145 45 145C35 145 32 140 32 132V55L20 62C15 65 10 60 12 52L28 38C32 35 36 35 40 35Z"
                  fill="#d96b7e" stroke="#c9607a" stroke-width="4" stroke-linejoin="round"/>
            <path d="M18 42C25 35 35 38 42 22C48 38 58 35 65 40C60 48 50 45 42 48C34 45 24 48 18 42Z"
                  fill="#a8d8a8" stroke="#7cb87c" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M42 22C42 15 45 10 50 8" stroke="#7cb87c" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="48"  cy="65"  r="2.2" fill="#fce4ec" opacity="0.9"/>
            <circle cx="36"  cy="80"  r="2.2" fill="#fce4ec" opacity="0.9"/>
            <circle cx="52"  cy="95"  r="2.2" fill="#fce4ec" opacity="0.9"/>
            <circle cx="45"  cy="115" r="2.2" fill="#fce4ec" opacity="0.9"/>
            <circle cx="55"  cy="130" r="2.2" fill="#fce4ec" opacity="0.9"/>
            <circle cx="28"  cy="58"  r="1.8" fill="#fce4ec" opacity="0.9"/>
          </svg>
        </div>
        <div class="strawberry-line"></div>
      </div>

      <div class="celebration-badge">Primer añito &amp; Bautizo</div>

      <p class="message-body">
        Hay momentos en la vida que son irrepetibles,<br>
        pero compartirlos con las personas<br>
        que más queremos los hace inolvidables.
      </p>

      <div class="romantic-date-display">
        <div class="date-side">Julio</div>
        <div class="date-center">04</div>
        <div class="date-side">Sábado</div>
      </div>

      <div class="romantic-details-list">
        <div class="romantic-item">
          <h5>Ceremonia Religiosa</h5>
          <p>1:00 pm</p>
        </div>
        <div class="romantic-item">
          <h5>Celebración en Salón</h5>
          <p>3:00 pm</p>
        </div>
      </div>

      <div class="actions-area">
        <a href="https://maps.google.com" target="_blank" class="web-btn btn-primary">
          📍 Abrir Mapa de Dirección
        </a>
        <a href="https://wa.me/1234567890?text=Hola!+Confirmo+mi+asistencia" target="_blank" class="web-btn btn-secondary">
          Confirmar Presencia
        </a>
      </div>

    </div>
  </div>
</body>
</html>
